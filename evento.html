<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Novo Evento | My Calendar</title>

    <!-- Fonte do Design System (Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Ícones do Bootstrap (instalados via npm) -->
    <link href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- Bootstrap + estilos do projeto, compilados pelo Sass -->
    <link href="assets/css/main.css" rel="stylesheet" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!-- Cabeçalho -->
    <header class="sticky-top">
      <nav class="navbar bg-white border-bottom" aria-label="Menu principal">
        <div class="container-xl">
          <a class="navbar-brand fw-bold text-primary" href="index.html">My Calendar</a>

          <!-- Menu do topo: só aparece a partir do lg (992px) -->
          <ul class="navbar-nav flex-row gap-4 ms-4 me-auto d-none d-lg-flex">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="evento.html">Novo Evento</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="estatisticas.html">Estatísticas</a>
            </li>
          </ul>

          <button class="btn btn-link text-secondary p-0" type="button" aria-label="Minha conta">
            <i class="bi bi-person-circle fs-3"></i>
          </button>
        </div>
      </nav>
    </header>

    <!-- Conteúdo principal -->
    <main class="flex-grow-1 container-xl py-4 py-md-5">
      <!-- O formulário fica centralizado e mais estreito em telas maiores -->
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
          <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
              <h1 class="mb-1">Novo evento</h1>
              <p class="text-body-secondary small mb-4">Preencha os dados abaixo para agendar um compromisso.</p>

              <form id="form-evento">
                <div class="mb-3">
                  <label class="form-label" for="titulo">Título do evento</label>
                  <input
                    class="form-control"
                    id="titulo"
                    name="titulo"
                    type="text"
                    placeholder="Ex: Reunião de planejamento"
                    required
                  />
                </div>

                <!-- Data ocupa a linha toda no celular; início e fim dividem a linha de baixo -->
                <div class="row g-3 mb-3">
                  <div class="col-12 col-md-4">
                    <label class="form-label" for="data">Data</label>
                    <input class="form-control" id="data" name="data" type="date" required />
                  </div>
                  <div class="col-6 col-md-4">
                    <label class="form-label" for="hora-inicio">Início</label>
                    <input class="form-control" id="hora-inicio" name="horaInicio" type="time" required />
                  </div>
                  <div class="col-6 col-md-4">
                    <label class="form-label" for="hora-fim">Fim</label>
                    <input class="form-control" id="hora-fim" name="horaFim" type="time" required />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="descricao">Descrição</label>
                  <textarea
                    class="form-control"
                    id="descricao"
                    name="descricao"
                    rows="3"
                    placeholder="Detalhes do evento (opcional)"
                  ></textarea>
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="categoria">Categoria</label>
                    <select class="form-select" id="categoria" name="categoria" required>
                      <option value="" selected>Selecione...</option>
                      <option value="trabalho">Trabalho</option>
                      <option value="pessoal">Pessoal</option>
                      <option value="saude">Saúde</option>
                      <option value="estudos">Estudos</option>
                      <option value="outro">Outro</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="recorrencia">Recorrência</label>
                    <select class="form-select" id="recorrencia" name="recorrencia">
                      <option value="nenhuma" selected>Não se repete</option>
                      <option value="diaria">Diariamente</option>
                      <option value="semanal">Semanalmente</option>
                      <option value="mensal">Mensalmente</option>
                      <option value="anual">Anualmente</option>
                    </select>
                  </div>
                </div>

                <!-- Endereço: o CEP será consultado na API ViaCEP (Entrega 3) -->
                <fieldset class="border-top pt-4">
                  <legend class="fs-6 fw-medium text-body-secondary text-uppercase mb-3">Local</legend>

                  <div class="row g-3 mb-3">
                    <div class="col-12 col-md-5">
                      <label class="form-label" for="cep">CEP</label>
                      <div class="input-group">
                        <input
                          class="form-control"
                          id="cep"
                          name="cep"
                          type="text"
                          maxlength="9"
                          placeholder="00000-000"
                        />
                        <button class="btn btn-outline-secondary" type="button" aria-label="Buscar CEP">
                          <i class="bi bi-search"></i>
                        </button>
                      </div>
                    </div>
                    <div class="col-12 col-md-7">
                      <label class="form-label" for="logradouro">Logradouro</label>
                      <input
                        class="form-control"
                        id="logradouro"
                        name="logradouro"
                        type="text"
                        placeholder="Rua, avenida..."
                      />
                    </div>
                  </div>

                  <!-- Bairro ocupa a linha toda no celular; cidade e UF dividem a linha de baixo -->
                  <div class="row g-3">
                    <div class="col-12 col-md-5">
                      <label class="form-label" for="bairro">Bairro</label>
                      <input class="form-control" id="bairro" name="bairro" type="text" placeholder="Ex: Centro" />
                    </div>
                    <div class="col-8 col-md-5">
                      <label class="form-label" for="cidade">Cidade</label>
                      <input class="form-control" id="cidade" name="cidade" type="text" placeholder="Ex: Curitiba" />
                    </div>
                    <div class="col-4 col-md-2">
                      <label class="form-label" for="uf">UF</label>
                      <input class="form-control" id="uf" name="uf" type="text" maxlength="2" placeholder="PR" />
                    </div>
                  </div>
                </fieldset>

                <!-- Botões: Cancelar volta para a lista -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                  <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
                  <button class="btn btn-primary" type="submit">Salvar evento</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="rodape border-top mt-auto">
      <div class="container-xl rodape-conteudo">
        <p class="mb-0 fw-medium">My Calendar © 2026</p>
        <nav class="rodape-links" aria-label="Links do rodapé">
          <a href="#">Privacidade</a>
          <a href="#">Termos</a>
          <a href="#">Suporte</a>
        </nav>
      </div>
    </footer>

    <!-- Menu do celular: some a partir do lg (992px) -->
    <nav class="barra-inferior border-top" aria-label="Menu do celular">
      <a class="barra-inferior-link" href="index.html">
        <i class="bi bi-house-door"></i>
        <span>Início</span>
      </a>
      <a class="barra-inferior-link ativo" aria-current="page" href="evento.html">
        <i class="bi bi-plus-circle"></i>
        <span>Novo</span>
      </a>
      <a class="barra-inferior-link" href="estatisticas.html">
        <i class="bi bi-bar-chart-line"></i>
        <span>Estatísticas</span>
      </a>
    </nav>

    <!-- JavaScript do Bootstrap -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
